version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Group to a single PR
    groups:
      actions:
        patterns:
          - "*"
    # Wait 7 days for newly published broken or compromised releases
    cooldown:
      default-days: 7

  # Update Python packages in doc/requirements.txt
  - package-ecosystem: "pip"
    directory: "/doc"
    schedule:
      interval: "weekly"
    groups:
      documentation-python:
        patterns:
          - "*"
    cooldown:
      default-days: 7
